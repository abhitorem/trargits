{% extends "base.html" %}
{% block content %}
<section>
  <h1>Services</h1>
  <div class="tree-grid">
    {% for node in services_nodes %}
      <article class="card">
        <h2><a href="{{ url_for('main.component_detail', slug=node.slug) }}">{{ node.label }}</a></h2>
        <p>{{ node.summary }}</p>
      </article>
    {% endfor %}
  </div>
</section>
{% endblock %}
